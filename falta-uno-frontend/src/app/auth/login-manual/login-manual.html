<form (ngSubmit)="enviar()" [formGroup]="form" class="login-form">
  <h2>Iniciar sesión (manual)</h2>

  <label>
    Correo
    <input type="email" formControlName="correo" />
  </label>
  <div class="error" *ngIf="form.controls['correo'].invalid && form.controls['correo'].touched">
    Ingresa un correo válido.
  </div>

  <label>
    Contraseña
    <input type="password" formControlName="password" />
  </label>
  <div class="error" *ngIf="form.controls['password'].invalid && form.controls['password'].touched">
    La contraseña debe tener al menos 6 caracteres.
  </div>

  <button type="submit" [disabled]="loading">{{ loading ? 'Ingresando...' : 'Ingresar' }}</button>

  <div class="error" *ngIf="error">{{ error }}</div>

  <p>
    ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
  </p>
</form>
