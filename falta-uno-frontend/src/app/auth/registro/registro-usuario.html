<form (ngSubmit)="enviar()" [formGroup]="form" class="registro-form">
  <h2>Registro de usuario</h2>

  <label>
    Correo
    <input type="email" formControlName="correo" />
  </label>
  <div class="error" *ngIf="form.controls['correo'].invalid && form.controls['correo'].touched">
    Ingresa un correo válido.
  </div>

  <label>
    Nombre
    <input type="text" formControlName="nombre" />
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" />
  </label>
  <label>
    Confirmar contraseña
    <input type="password" formControlName="confirmar" />
  </label>

  <div class="error" *ngIf="!validarPasswords() && form.controls['confirmar'].touched">Las contraseñas no coinciden.</div>

  <button type="submit" [disabled]="loading">{{ loading ? 'Registrando...' : 'Registrar' }}</button>

  <div class="error" *ngIf="error">{{ error }}</div>

  <p>
    ¿Ya tienes cuenta? <a routerLink="/login-manual">Ingresar</a>
  </p>
</form>
