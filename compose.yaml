name: comunidad-deportiva

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: comunidad_deportiva_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Ejecuta npm run docker:env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comunidad_deportiva_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-setup:
    profiles: [tools]
    build:
      context: ./packages/database
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_PORT: "5432"
      MIGRATION_DB_USER: postgres
      MIGRATION_DB_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Ejecuta npm run docker:env}
      APP_DB_PASSWORD: ${DOCKER_APP_PASSWORD:?Ejecuta npm run docker:env}

volumes:
  postgres_data:
